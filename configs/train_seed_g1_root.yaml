result_dir: ./out
dataset: datasets/seed_g1_motion_features/train.pt
max_steps: 50000
batch_size: 256
num_workers: 8
min_tokens: 4
max_tokens: 16
seed: 42

log_dir: out/training_logs
run_name: seed-g1-root-short

trainer:
  devices: 8
  num_nodes: 1
  accelerator: auto
  strategy: auto
  matmul_precision: high
  enable_progress_bar: true
  log_every_n_steps: 50
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  limit_val_batches: 0.0
  num_sanity_val_steps: 0

wandb:
  enabled: true
  project: motionbricks
  entity: null
  offline: false
  tags: [seed-g1, root, short-token]

checkpoint:
  enabled: true
  filename: "{step}"
  every_n_train_steps: 5000
  save_last: true
  save_top_k: -1
  save_weights_only: false

learning_rate_monitor:
  enabled: true
  logging_interval: step

init_from_checkpoint:
  enabled: true
  path: null
  strict: false
