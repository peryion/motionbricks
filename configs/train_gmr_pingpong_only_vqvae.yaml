result_dir: ./out
log_dir: out/training_logs
run_name: gmr-pingpong-only-vqvae

dataset: datasets/gmr_pingpong_g1_motion_features/train_tt.pt

max_steps: 20000
batch_size: 64
num_workers: 4
min_tokens: 6
max_tokens: 16
seed: 42

lr: 1.0e-5
final_lr: 2.0e-7
warmup_steps: 500

trainer:
  devices: 1
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  matmul_precision: high
  enable_progress_bar: true
  log_every_n_steps: 20
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  limit_val_batches: 0.0
  num_sanity_val_steps: 0

wandb:
  enabled: true
  project: motionbricks
  entity: null
  offline: false
  tags: [gmr-pingpong, vqvae, pingpong-only]

checkpoint:
  enabled: true
  filename: "{step}"
  every_n_train_steps: 2000
  save_last: true
  save_top_k: -1
  save_weights_only: false

learning_rate_monitor:
  enabled: true
  logging_interval: step

init_from_checkpoint:
  enabled: true
  path: out/motionbricks_vqvae/version_1/checkpoints/model-step=2000000.ckpt
  strict: false
